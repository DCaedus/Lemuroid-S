name: Publish

on:
  push:
    tags:
      - "*"

jobs:

  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" > release.keystore.asc
          gpg -d --passphrase "${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}" --batch release.keystore.asc > release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        # Regular APK (cores downloaded when needed) and full APK (every core inside, 64-bit ARM only).
        run: ./gradlew assembleFreeDynamicRelease assembleFreeBundleRelease

      - name: Rename APKs
        run: |
          mkdir apk
          cp modules/lemuroid-app/build/outputs/apk/freeDynamic/release/lemuroid-app-free-dynamic-release.apk "apk/lemuroid-s-${GITHUB_REF_NAME}.apk"
          cp modules/lemuroid-app/build/outputs/apk/freeBundle/release/lemuroid-app-free-bundle-release.apk "apk/lemuroid-s-${GITHUB_REF_NAME}-full.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/*.apk

  publish_apk:
    name: Publish APK on Github
    needs: [ build ]
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Create pre-release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          title: "Pre-release"
          files: "*.apk"
